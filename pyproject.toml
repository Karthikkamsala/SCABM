[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplychain-abm"
version = "0.1.0"
description = "An open-source Python framework for agent-based simulation of supply chains."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karthik Kamsala", email = "karthikkamsali007.kk@gmail.com" },
]
keywords = [
    "agent-based-modelling",
    "supply-chain",
    "simulation",
    "mesa",
    "abm",
    "inventory",
    "logistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mesa>=3.0,<3.1; python_version < '3.11'",
    "mesa>=3.1,<3.4; python_version >= '3.11' and python_version < '3.12'",
    "mesa>=3.5,<4; python_version >= '3.12'",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Karthikkamsala/SCABM"
Documentation = "https://github.com/Karthikkamsala/SCABM#readme"
Repository = "https://github.com/Karthikkamsala/SCABM"
Issues = "https://github.com/Karthikkamsala/SCABM/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/supplychain_abm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
